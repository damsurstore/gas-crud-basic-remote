<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <?!= include('myCss'); ?>
  </head>   
  <body>
    <div class="container">
      <div class="row mt-4">
        <div class="col-lg-12">
          <h1>Selamat datang di Aplikasi Web Menggunakan Google Apps Script</h1>
        </div>
      </div>
      <div class="row mt-4">
        <div class="col-lg-12">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Nama Produk</th>
                <th scope="col">Satuan</th>
                <th scope="col">Harga</th>
              </tr>
            </thead>
            <tbody id="myData">

            </tbody>
          </table>
        </div>
      </div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        loadData();
      })
      function loadData(){
        google.script.run
        .withSuccessHandler(function (mydata){
          displayData(mydata)
        })
        .withFailureHandler(function (){
          showError();
        })
        .getDataDariSheet();
      }
      function displayData(data){
        // console.log(data);
        let html = ``;
        for (let i=0; i < data.length; i++){
          html+=`<tr>`;
          for (let j=0; j < data.length; j++){
            html+=`<td>${data[i][j]}</td>`;
          }
          html+=`</tr>`;
        }
        document.getElementById('myData').innerHTML = html;
      }
      function showError(){
        alert('Error');
      }
    </script>
  </body>
</html>
